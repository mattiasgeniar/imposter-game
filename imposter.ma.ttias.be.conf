imposter.ma.ttias.be {
    encode zstd gzip

    log {
        output file /var/www/html/imposter.ma.ttias.be/logs/access.log
    }

    header {
        Strict-Transport-Security "max-age=31536000"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
        Referrer-Policy "no-referrer"
        Permissions-Policy "geolocation=(), microphone=(), camera=()"
        -Server
    }

    root * /var/www/html/imposter.ma.ttias.be/public

    # Vite hashed assets — safe to cache forever
    @assets path /assets/*
    header @assets Cache-Control "public, max-age=31536000, immutable"

    # Everything else (index.html, sw.js, manifest.webmanifest, icons) — 1 day
    @rest not path /assets/*
    header @rest Cache-Control "public, max-age=86400"

    file_server
}
